<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blog</title>
<link rel="stylesheet" href="style.css" />
<base href="./">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Blog</div>
    <a class="nav-item active" href="index.html">Home</a>
    <a class="nav-item" href="index.html">Blog</a>
    <a class="nav-item" href="index.html?tag=Movies">Movies</a>
    <a class="nav-item" href="index.html?tag=TV">TV Shows</a>
    <a class="nav-item" href="index.html?tag=Anime">Anime</a>
    <a class="nav-item" href="index.html?tag=Manga">Manga</a>
    <a class="nav-item" href="index.html?tag=Music">Music</a>
    <a class="nav-item" href="index.html?tag=Books">Books</a>
    <a class="nav-item" href="index.html?tag=Papers">Papers</a>
    <a class="nav-item" href="about.html">About</a>
    <div style="flex:1"></div>
    <a class="nav-item" href="admin.html" style="margin-top:12px;opacity:0.9">Admin</a>
  </aside>

  <main class="main">
    <header class="header">
      <h1 class="big">Welcome</h1>
      <p class="lead">A quiet corner for thoughts on code, culture, and creation. Hand-crafted HTML, pure focus.</p>
      <div class="section-title">Recent</div>
    </header>

    <section class="posts" id="posts"></section>
  </main>

<script src="script.js"></script>
<script>
(async function(){
  await KBlog.seedIfEmpty();
  const posts = KBlog.loadPosts();
  const container = document.getElementById("posts");
  const urlTag = new URLSearchParams(location.search).get("tag") || "All";
  const filtered = urlTag === "All" ? posts : posts.filter(p=>p.tag===urlTag);

  function renderPost(p){
    const el = document.createElement("article");
    el.className = "post-card";
    el.innerHTML = `
      <h2>${p.title}</h2>
      <div class="meta">
        <div class="small">${p.date || KBlog.prettyDate(p.dateCreated)}</div>
        <div class="badge">${p.tag}</div>
      </div>
      <div class="excerpt">${p.review.length>400 ? p.review.slice(0,400)+"…" : p.review}</div>
      <div class="card-actions">
        <button class="btn" onclick="location.href='blog.html?id=${p.id}'">Read</button>
        <button class="btn ghost" onclick="sharePost('${p.id}')">Share</button>
      </div>
    `;
    return el;
  }

  if(filtered.length===0){
    container.innerHTML = '<div class="post-card"><p class="small">No posts yet.</p></div>';
  } else {
    filtered.forEach(p=> container.appendChild(renderPost(p)));
  }

  window.sharePost = function(id){
    const post = posts.find(x=>x.id===id);
    if(navigator.share){
      navigator.share({title:post.title,text:post.review,url:location.origin + '/blog.html?id='+id}).catch(()=>{});
    } else {
      navigator.clipboard.writeText(location.origin + '/blog.html?id='+id).then(()=>alert("Link copied"));
    }
  };

})();
</script>
<script>
  // Highlight active sidebar link based on ?tag=
  const params = new URLSearchParams(window.location.search);
  const tag = params.get('tag');

  document.querySelectorAll('.sidebar a').forEach(link => {
    const hrefTag = link.getAttribute('href')?.split('tag=')[1];
    if (hrefTag === tag) {
      link.classList.add('active');
    }
  });
</script>

</body>
</html>
