name: Generate Posts Index

on:
  push:
    paths:
      - 'posts/*.md'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate posts.json
        run: |
          echo "[" > posts.json
          first=true

          for file in posts/*.md; do
            slug=$(basename "$file" .md)
            title=$(grep -m 1 "^# " "$file" | sed 's/^# //')
            date=$(date -r "$file" +"%Y-%m-%d")

            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> posts.json
            fi

            echo "  {" >> posts.json
            echo "    \"title\": \"$title\"," >> posts.json
            echo "    \"slug\": \"$slug\"," >> posts.json
            echo "    \"tag\": \"Blog\"," >> posts.json
            echo "    \"date\": \"$date\"" >> posts.json
            echo "  }" >> posts.json

          done

          echo "]" >> posts.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts.json
          git commit -m "Auto-generate posts.json" || echo "No changes"
          git push