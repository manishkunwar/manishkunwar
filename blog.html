<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Blog Post</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Blog</div>
    <a class="nav-item" href="index.html">← Back to Home</a>
  </aside>

  <main class="main">
    <div id="container"></div>
  </main>

<script src="script.js"></script>
<script>
(async function(){
  await KBlog.seedIfEmpty();
  const posts = KBlog.loadPosts();
  const id = KBlog.qParam("id");
  const p = posts.find(x=>x.id===id);
  const container = document.getElementById("container");
  if(!p){
    container.innerHTML = `<div class="post-card"><p class="small">Post not found.</p></div>`;
    return;
  }
  container.innerHTML = `
    <div class="post-card">
      <h2>${p.title}</h2>
      <div class="meta">
        <div class="small">${p.date || KBlog.prettyDate(p.dateCreated)}</div>
        <div class="badge">${p.tag}</div>
      </div>
      ${p.photo ? `<img class="blog-image" src="${p.photo}" alt="">` : ""}
      <div class="excerpt">${p.review.replace(/\n/g,'<br>')}</div>
      <div class="card-actions">
        <button class="btn" onclick="location.href='index.html'">Back</button>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
